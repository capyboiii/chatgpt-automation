browser:
  headless: false
  profiles_dir: ./.chrome-profiles
  profiles:
  - name: acc1
    tabs: 1
  - name: acc2
    tabs: 1
  generation_timeout: 300
  nav_timeout: 90
run:
  max_retries: 3
  batch_size: 6
  # đủ ảnh rồi vẫn chờ ngần này giây thấy danh sách ảnh
  # đứng yên mới chốt (ChatGPT hay vẽ lại 1 ảnh ở phút chót)
  settle_seconds: 8

