<!doctype html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chạy CSV — Mockup Forge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=1">
  <style>
    .csv-hero { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
    .csv-hint { font-size:.84rem; color:var(--text-dim); line-height:1.6; }
    .csv-hint code { font-family:var(--f-mono); font-size:.78rem; }
    .csv-thumbs { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:10px; }
    .csv-thumb { position:relative; border:1px solid var(--border); border-radius:var(--radius-xs); overflow:hidden; background:var(--bg-panel-solid); }
    .csv-thumb img { width:100%; aspect-ratio:1/1; object-fit:cover; display:block; cursor:zoom-in; }
    .csv-thumb span { position:absolute; left:6px; top:6px; font-family:var(--f-mono); font-size:.7rem; padding:1px 6px; border-radius:6px; background:rgba(0,0,0,.6); color:#fff; }
    .csv-folder { font-family:var(--f-mono); font-size:.74rem; color:var(--muted); }
    .csv-err { font-size:.78rem; color:var(--err); margin-top:8px; }
    .csv-wait { font-size:.8rem; color:var(--muted); }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-logo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
        </div>
        <div class="brand-text-group">
          <span class="brand-name">Mockup<b>Forge</b></span>
          <span class="brand-badge">Chạy CSV</span>
        </div>
      </div>
      <div class="topbar-right">
        <a href="/" class="btn action-btn sm">← Trang chính</a>
        <span class="pool-stat-pill"><span class="pulse-indicator"></span><span id="pool-info">0 tài khoản</span></span>
      </div>
    </div>
  </header>

  <main class="app-container">
    <section class="panel">
      <div class="csv-hero">
        <div class="csv-hint">
          Mỗi dòng CSV là một phiên chat, gửi <b>nguyên văn</b> cột <code>PROMPT</code>
          (không khuôn prompt, không ảnh). Ảnh trả về lưu vào
          <code>designs/&lt;TOPIC hoặc CHARACTER&gt;__&lt;Style&gt;/1.png, 2.png…</code>
        </div>
        <div>
          <input type="file" id="csv-input" accept=".csv,text/csv" hidden>
          <button type="button" id="btn-csv" class="btn primary">Chọn CSV &amp; chạy</button>
        </div>
      </div>
    </section>

    <section class="panel panel-results" id="results-panel" hidden>
      <div class="panel-head">
        <div class="panel-title-group">
          <div class="section-title-wrap"><h2>Kết Quả</h2></div>
          <span class="stat-pill-badge emerald"><span class="stat-dot emerald"></span><span class="stat-val" id="stat">0/0 ảnh · 0 bộ</span></span>
        </div>
        <div class="results-actions">
          <button type="button" id="btn-stop" class="btn danger sm" hidden>🛑 Dừng khẩn cấp</button>
          <a href="/api/jobs/zip" class="btn primary-subtle sm">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            Tải ZIP
          </a>
        </div>
      </div>

      <!-- Dải trạng thái giống trang chính: số bộ, tiến độ, đội tài khoản -->
      <div id="run-strip" class="run-strip">
        <div class="run-strip-line">
          <span class="batch-badge" id="run-badge">0/0 bộ</span>
          <span class="batch-status-text" id="run-text"></span>
        </div>
        <div class="progress-track"><div class="progress-fill" id="run-fill" style="width:0%"></div></div>
        <div class="fleet-status-bar"><div id="fleet-chips" class="fleet-chips"></div></div>
      </div>

      <div id="list"></div>
    </section>
  </main>

  <div id="toast-container" class="toast-container"></div>
  <script src="csvrun.js?v=1"></script>
</body>
</html>
