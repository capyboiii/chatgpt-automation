<!doctype html>
<html lang="vi" data-theme="dark">
<head>
  <script src="theme.js?v=1"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CSV chung phiên — Mockup Forge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=56">
  <style>
    .csvs-hero{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
    .csvs-hint{font-size:.84rem;color:var(--text-dim);line-height:1.65;max-width:760px}
    .csvs-hint code,.csvs-folder{font-family:var(--f-mono);font-size:.76rem}
    .csvs-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .csvs-skip{display:flex;align-items:center;gap:7px;font-size:.8rem;color:var(--text-dim);cursor:pointer}
    .csvs-thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
    .csvs-thumb{position:relative;border:1px solid var(--border);border-radius:var(--radius-xs);overflow:hidden;background:var(--bg-panel-solid);cursor:pointer}
    .csvs-thumb img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;filter:grayscale(1);opacity:.5}
    .csvs-thumb.picked{border-color:var(--accent)} .csvs-thumb.picked img{filter:none;opacity:1}
    .csvs-thumb span{position:absolute;left:6px;top:6px;font-family:var(--f-mono);font-size:.68rem;padding:2px 6px;border-radius:6px;background:rgba(0,0,0,.65);color:#fff}
    .csvs-prompt{margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
    .csvs-prompt-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
    .csvs-prompt-name{font-weight:700;color:var(--text)} .csvs-folder{color:var(--muted)}
    .csvs-result img{filter:none;opacity:1;cursor:zoom-in}
    .csvs-result .csvs-regen-image{position:absolute;right:6px;bottom:6px;z-index:1;padding:5px 7px;border:1px solid var(--border);border-radius:6px;background:var(--bg-panel-solid);color:var(--text);cursor:pointer}
    .csvs-result .csvs-regen-image:disabled{opacity:.5;cursor:not-allowed}
    .csvs-wait{font-size:.8rem;color:var(--muted);padding:10px 0}.csvs-err{font-size:.78rem;color:var(--err);margin-top:8px}
    .csvs-control-panel{display:grid;gap:18px}
    .csvs-control-panel>.workflow-block,.csvs-control-panel>.csvs-fields{padding:14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-card)}
    .csvs-control-panel>.csvs-fields{border-left:3px solid var(--accent-cyan)}
    .csvs-control-panel>.workflow-block{border-left:3px solid var(--accent)}
    .csvs-inline-attachments{margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
    .csvs-inline-attachments .panel-head{margin-bottom:10px}
    .csvs-control-panel .csvs-toolbar{padding-top:12px;border-top:0}
    .workflow-submit{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:14px;border-top:1px solid var(--border)}
    .workflow-submit .btn{min-width:145px}
    .csvs-hero-copy{max-width:760px}
    .csvs-kicker{font:700 .72rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent-cyan)}
    .csvs-title{font:700 clamp(1.35rem,2.5vw,2rem) var(--f-display);margin:3px 0 8px}
    .csvs-thinking{min-width:210px;padding:12px 15px;border:1px solid var(--border-cyan);border-radius:var(--radius-sm);background:rgba(6,182,212,.08);display:grid;gap:3px}
    .csvs-thinking span{font-size:.73rem;color:var(--text-dim)}
    .csvs-thinking strong{font:700 1.12rem var(--f-display);color:var(--accent-cyan)}
    .csvs-thinking.warning{border-color:var(--warn);background:rgba(245,158,11,.08)}
    .csvs-thinking.warning strong{color:var(--warn)}
    .csvs-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-top:14px;border-top:1px solid var(--border)}
    .csvs-toolbar-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .csvs-toolbar .btn[disabled],.csvs-toolbar .btn[aria-disabled="true"]{opacity:.48;cursor:not-allowed;pointer-events:none}
    .csvs-warnings{padding:10px 12px;border:1px solid var(--warn);border-radius:var(--radius-xs);background:rgba(245,158,11,.08);color:var(--text-dim);font-size:.8rem}
    .csvs-card-actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
    .csvs-results-actions{display:flex;align-items:center;justify-content:flex-end;gap:7px;flex-wrap:wrap}
    .csvs-results-actions .btn{min-height:34px;white-space:nowrap}
    .csvs-results-actions #btn-refresh{min-width:34px;padding:6px}
    .csvs-card-actions .csvs-delete{min-height:32px;border:1px solid var(--border);color:var(--err);background:var(--bg-panel-solid)}
    .csvs-card-actions .csvs-delete:disabled{opacity:.4;cursor:not-allowed}
    .csvs-card-actions .csvs-delete:hover:not(:disabled){background:var(--err-soft);border-color:var(--err)}
    .csvs-results-actions a[aria-disabled="true"],.row-action-menu a[aria-disabled="true"]{opacity:.45;pointer-events:none;cursor:not-allowed}
    .csvs-card-actions .btn{white-space:nowrap}
    .csvs-card-actions .btn[disabled]{opacity:.48;cursor:not-allowed}
    .csvs-card-actions .csvs-disabled{opacity:.48;pointer-events:none}
    .csvs-fields{display:grid;gap:10px}.csvs-field-list{display:grid;gap:6px;max-width:680px}
    .csvs-field{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-xs);background:var(--bg-panel-solid)}
    .csvs-field span{flex:1;min-width:0;overflow-wrap:anywhere}.csvs-field button{min-width:32px}
    .csvs-fields select{max-width:360px;width:100%;padding:9px;background:var(--bg-panel-solid);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-xs)}
    .csvs-size-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.csvs-size-row select[disabled]{opacity:.48}
    .csvs-preview-link{display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in;text-align:left}
    .csvs-preview-link:focus-visible,.csvs-result button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    /* Kết quả dạng gallery: mỗi prompt là một ô, không kéo dài hết một hàng. */
    #list .collection-card{padding:12px;margin-bottom:10px}
    #list .collection-header{padding-bottom:9px;margin-bottom:10px}
    .csvs-prompt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px;align-items:start}
    .csvs-prompt{min-width:0;margin:0;padding:9px;border:1px solid var(--border);border-radius:var(--radius-xs);background:var(--bg-panel-solid)}
    .csvs-prompt-head{gap:7px;margin-bottom:7px;min-height:22px}
    .csvs-prompt-name{font-size:.75rem;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .csvs-done-mark{display:grid;place-items:center;flex:none;width:19px;height:19px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:.74rem;font-weight:800}
    .csvs-prompt .csvs-thumbs{grid-template-columns:repeat(auto-fit,minmax(min(100%,100px),1fr));gap:5px}
    .csvs-prompt .csvs-result{min-width:0}
    .csvs-prompt .csvs-result img{height:152px;aspect-ratio:auto;object-fit:cover}
    .csvs-prompt .csvs-result span{font-size:.62rem;padding:2px 5px}
    .csvs-prompt .csvs-wait{display:grid;place-items:center;min-height:95px;padding:7px;border:1px dashed var(--border);border-radius:var(--radius-xs);font-size:.73rem}
    .csvs-prompt .csvs-err{font-size:.72rem;line-height:1.4;overflow-wrap:anywhere}
    @media(max-width:720px){.csvs-toolbar-group{width:100%}.csvs-toolbar-group .btn{flex:1}.csvs-thinking{width:100%}.csvs-results-actions{width:100%;justify-content:flex-start}}
    @media(max-width:520px){.csvs-prompt-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.csvs-prompt .csvs-result img{height:138px}}
    @media(max-width:340px){.csvs-prompt-grid{grid-template-columns:1fr}}
  </style>
  <link rel="stylesheet" href="studio-ui.css?v=1">
</head>
<body>
  <header class="topbar"><div class="topbar-inner">
    <div class="brand"><div class="brand-logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg></div><div class="brand-text-group"><span class="brand-name">Mockup<b>Forge</b></span><span class="brand-badge">Tạo từ bảng</span></div></div>
    <div class="topbar-right"><a href="/" class="btn action-btn sm">← Trang chính</a><button id="theme-toggle" class="btn action-btn sm" type="button" title="Đổi giao diện Sáng / Tối"><span class="theme-label">Chế độ tối</span></button></div>
  </div></header>
  <main class="app-container">
    <section class="panel csvs-control-panel mode-intro" aria-labelledby="mode-title-session">
      <div class="csvs-hero mode-intro-head">
        <div class="csvs-hero-copy mode-intro-copy"><h1 class="csvs-title mode-title" id="mode-title-session">Tạo từ bảng</h1>
          <p class="csvs-hint mode-description">Mỗi hàng tạo một bộ ảnh. Chọn nội dung cần dùng.</p>
        </div>
      </div>
      <div class="workflow-block"><div class="workflow-block-title"><span class="step-number">1</span><strong>Chọn bảng và ảnh mẫu</strong></div>
      <div class="csvs-toolbar mode-toolbar">
        <div class="csvs-toolbar-group"><input id="csv-input" type="file" accept=".csv,.xlsx,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden><button id="btn-csv" class="btn primary" title="Chọn tệp CSV hoặc Excel">Chọn bảng dữ liệu</button><input id="img-input" type="file" accept="image/*" multiple hidden><button id="btn-img" class="btn action-btn sm">Thêm ảnh mẫu</button><label class="csvs-skip"><input id="skip-done" type="checkbox"> Bỏ qua hàng đã xong</label></div>
      </div>
      <div class="csvs-inline-attachments" id="attach-panel" hidden><div class="panel-head"><div class="panel-title-group"><div class="section-title-wrap"><h2>Ảnh đính kèm</h2></div><span class="stat-pill-badge cyan"><span id="attach-stat">0 ảnh</span></span></div><div class="panel-head-actions"><button id="btn-upload" class="btn primary-subtle sm" title="Tải ảnh lên">+ Ảnh</button><button id="btn-none" class="btn action-btn sm" title="Gỡ tất cả ảnh">Gỡ hết</button><button id="btn-close" class="btn action-btn sm" title="Đóng">✕</button></div></div><div id="selected-attachments" class="attachment-selected"></div><details class="attachment-library"><summary>Thư viện ảnh</summary><div id="attach-grid" class="csvs-thumbs"></div></details></div></div>
      <div id="csv-field-panel" class="csvs-fields" hidden>
        <div class="workflow-block-title"><span class="step-number">2</span><strong>Chọn nội dung và thứ tự</strong></div>
        <div><strong id="csv-file-name"></strong> <span id="csv-row-count" class="csvs-hint"></span></div>
        <div id="csv-field-list" class="csvs-field-list"></div>
        <div class="csvs-size-row"><label class="csvs-skip" title="Chỉ gửi yêu cầu tạo ảnh, không đính kèm ảnh mẫu"><input id="csv-size-enabled" type="checkbox"> Tạo bảng kích thước</label><select id="csv-size-field" aria-label="Cột thông tin kích thước" disabled></select></div>
        <div class="workflow-submit"><div class="workflow-block-title"><span class="step-number">3</span><strong>Bắt đầu tạo</strong></div><button id="btn-start-csv" class="btn primary">▶ Tạo ảnh</button></div>
      </div>
      <div id="warning-panel" class="csvs-warnings" hidden></div>
    </section>
    <section class="panel panel-results" id="results-panel" hidden><div class="panel-head"><div class="panel-title-group"><div class="section-title-wrap"><h2><span class="step-number">4</span> Ảnh đã tạo</h2></div><span class="stat-pill-badge emerald"><span id="stat">0/0 hàng</span></span></div><div class="csvs-results-actions"><button id="btn-resume" class="btn primary-subtle sm" disabled hidden>▶ Chạy tiếp</button><button id="btn-stop" class="btn danger sm" disabled hidden title="Dừng tất cả tác vụ đang chạy">■ Dừng tất cả</button><a id="btn-download-all" href="/api/jobs/zip?mode=csv-session" class="btn primary-subtle sm" aria-disabled="true" tabindex="-1" title="Tải ảnh của tất cả các bộ">↓ Tải tất cả</a><button id="btn-refresh" class="btn action-btn sm" title="Cập nhật kết quả" aria-label="Cập nhật kết quả">↻</button></div></div><div id="run-strip" class="run-strip"><div class="run-strip-line"><span class="batch-badge" id="run-badge">0/0 hàng</span><span class="batch-status-text" id="run-text"></span></div><div class="progress-track"><div class="progress-fill" id="run-fill" style="width:0%"></div></div><div class="fleet-status-bar"><div id="fleet-chips" class="fleet-chips"></div></div></div><div id="list"></div></section>
  </main>
  <div id="csv-image-viewer" class="lightbox-modal" hidden role="dialog" aria-modal="true" aria-label="Xem ảnh">
    <div class="lightbox-backdrop"></div><div class="lightbox-content">
      <button id="csv-viewer-close" class="lightbox-close" type="button" aria-label="Đóng">✕</button>
      <div class="lightbox-img-wrap"><img id="csv-viewer-image" alt="Ảnh kết quả"></div>
      <div class="lightbox-info"><span id="csv-viewer-name" class="lightbox-caption"></span><a id="csv-viewer-download" class="btn primary sm" download>↓ Tải ảnh</a></div>
    </div>
  </div>
  <div id="toast-container" class="toast-container"></div>
  <script src="csvsession.js?v=5"></script>
</body>
</html>
